name: 전단 자동 갱신 + 배포

on:
  schedule:
    - cron: '0 20 * * *'   # 매일 05:00 KST (20:00 UTC) — 전단
    - cron: '30 18 * * 0'  # 매주 월요일 03:30 KST — 전국 마트 위치(OpenStreetMap)
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      marts:
        description: '전국 마트 위치 데이터도 새로 받기'
        type: boolean
        default: false
  push:
    branches: [main]        # 코드/데이터를 직접 고치면 바로 다시 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: martestro
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OCR 도구 설치 (탑마트용 · 실패해도 계속)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor python3-pil
          tesseract --version | head -1
      - name: 전국 마트 위치 갱신 (주 1회 · 실패하면 기존 유지)
        if: github.event.schedule == '30 18 * * 0' || inputs.marts
        continue-on-error: true
        timeout-minutes: 25
        run: |
          sudo apt-get install -y -qq osmium-tool || true
          node scripts/build_marts.js
      - name: 전단·편의점 행사 읽기 → data/deals.json 갱신
        timeout-minutes: 25  # 세븐일레븐 목록 응답이 느려(쪽당 ~10초) 편의점 포함 10분 남짓
        run: node scripts/update_deals.js
      - name: 앱(index.html) 다시 만들기 + 테스트
        run: |
          node scripts/build.js
          node test/test.js
      - name: 바뀐 경우에만 커밋
        run: |
          # 도는 사이에 main 이 바뀌었으면(코드 push 등) 새 main 위에 이번 데이터만 얹고 앱을 다시 만들어요.
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            rm -rf /tmp/newdata && cp -r data /tmp/newdata
            git reset -q --hard origin/main
            cp /tmp/newdata/deals.json data/deals.json && rm -rf data/marts && cp -r /tmp/newdata/marts data/marts
            node scripts/build.js
          fi
          git add data/deals.json data/marts index.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 배포할 파일만 모으기
        run: |
          mkdir -p _site
          cp -r index.html data assets _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
